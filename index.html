<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fulfillment</title>
<style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#17324a;background:#f3f7f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(760px,100%);background:#fff;border:1px solid #dbe5e9;border-radius:20px;padding:clamp(28px,6vw,56px);box-shadow:0 20px 70px #18384b12}
.badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:#e8f5f2;color:#087f6b;font-size:12px;font-weight:700;letter-spacing:.04em}
h1{font-size:clamp(36px,7vw,58px);letter-spacing:-.05em;margin:20px 0 12px}
p{font-size:17px;line-height:1.65;color:#526779;max-width:580px}
.status{margin-top:32px;padding:18px 20px;background:#f5f8fa;border-radius:12px;color:#536879}
.status strong{color:#17324a}
</style>
</head>
<body><main><span class="badge">FULFILLMENT · PROJECT PREVIEW</span><h1>Fulfillment</h1><p>Order management workspace is being built here. This preview is connected to the GitHub repository and will update when new changes are published.</p><div class="status"><strong>Project status</strong><br>Foundation stage — dashboard, order entry, roles, database, and undo/redo are planned.</div></main></body>
</html>
